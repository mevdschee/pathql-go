driver  = "postgres"
listen  = ":8000"
verbose = true

[security]
identity_kind     = "login_role"
auth_table_prefix = "pathql_auth_"
read_only         = true
admin_user        = "admin"
startup_checks    = "warn"

[auth]
methods = ["apikey"]

[roles]
base_dsn      = "host=db port=5432 dbname=pathql sslmode=disable"
baseline_role = "pathql_auth"
prefix        = "pathql_r_"
reader_role   = "pathql_readers"
# Each per-role connection authenticates with a password derived as
# HMAC-SHA256(password_secret, role). The same value goes into the sync DDL
# (CREATE ROLE ... PASSWORD) and is re-derived at connect time, so no per-role
# secret is stored. In a real deployment keep this out of the file via ${ENV}.
password_secret = "login-role-demo-secret"
