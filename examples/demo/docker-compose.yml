name: pathql-demo

# A one-command demo of the simple, single-connection model: the server connects
# as one shared role (pathql_app) and there is no row-level security. Run it with:
#
#   cd examples/demo
#   docker compose up --build
#
# Then follow the walkthrough in README.md. Tear down (including the database
# volume) with: docker compose down -v

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pathql
    # initdb scripts run once, in filename order, on first boot only.
    volumes:
      - ./initdb:/docker-entrypoint-initdb.d:ro
    # Published on 5433 to avoid colliding with a Postgres already on the host's
    # 5432 (and with the sibling login-role demo on 5434). The server reaches the
    # database over the compose network, not this port; it only lets you psql in
    # from the host:
    #   psql -h localhost -p 5433 -U postgres pathql
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d pathql"]
      interval: 2s
      timeout: 3s
      retries: 30

  server:
    # Build context is the repo root so the whole module is available.
    build:
      context: ../..
      dockerfile: examples/demo/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./config.ini:/app/config.ini:ro
    ports:
      - "8000:8000"   # POST /pathql, GET /metrics
