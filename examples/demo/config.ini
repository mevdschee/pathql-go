driver  = "postgres"
# Single shared connection (identity_kind defaults to "none"): every request
# runs as pathql_app, with no row-level security. The server reaches the
# database over the compose network as host "db".
dsn     = "host=db port=5432 user=pathql_app password=pathql_demo_pw dbname=pathql sslmode=disable"
listen  = ":8000"
verbose = true

[security]
auth_table_prefix = "pathql_auth_"
read_only         = true
metrics_user      = "metrics"
startup_checks    = "warn"

[auth]
methods = ["apikey", "basic"]
