# Demo configuration for pathql-server. NOT hardened for production: it talks to
# the demo database over a plaintext localhost network and uses fixed demo
# credentials. See ../../README.md and ../rls_policy.sql for the real settings.

driver  = "postgres"
# host=db is the compose service name. The password comes from the
# PATHQL_DB_PASSWORD env var set in docker-compose.yml.
dsn     = "host=db port=5432 user=pathql_app password=${PATHQL_DB_PASSWORD} dbname=pathql sslmode=disable"
listen  = ":8000"
# Log one line per request so `docker compose logs server` shows the demo working.
verbose = true

[database]
max_open_conns       = 50
max_idle_conns       = 10
conn_max_lifetime_ms = 300000

[security]
auth_table_prefix          = "pathql_auth_"
session_variable           = "app.user"
read_only                  = true
block_multiple_statements  = true
# The app_user allowed to read GET /metrics; that principal can do nothing else.
metrics_user               = "metrics"
# Database hardening self-check at startup: off | warn | enforce.
startup_checks             = "warn"

[auth]
methods        = ["apikey", "basic"]
api_key_header = "X-API-Key"

[limits]
max_query_ms            = 5000
max_body_bytes          = 1048576
max_response_bytes      = 10485760
max_concurrent_per_user = 10
max_concurrent_global   = 200
# Bumped above the default 120 so poking at the demo by hand never hits 429.
max_requests_per_min_ip = 600

[timeouts]
read_ms  = 10000
write_ms = 30000
idle_ms  = 60000

[cache]
backend   = "embedded"
memory_mb = 64
auth_ttl  = "30s"
jwks_ttl  = "1h"

[tls]
enabled = false
hsts    = true

[cors]
allowed_origins = []
