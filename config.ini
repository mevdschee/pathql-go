# Minimal pathql-server configuration (the simple, no-RLS setup): every query
# runs on one shared connection. This is the development / single-tenant
# on-ramp. The README documents every option and the hardened "login_role" mode
# (a database role per user, with row-level security on current_user).

driver = "postgres"
dsn    = "host=localhost port=5432 dbname=pathql sslmode=disable"
listen = ":8000"

# Authentication is optional in this mode. Omit [auth] to run open (the server
# logs a warning at startup), or require an API key / Basic password:
# [auth]
# methods = ["apikey", "basic"]

# Optional SQL gate: reject anything that is not a single read-only statement
# over non-catalog objects (no stacked statements, no SET/SHOW/EXPLAIN/COPY/DDL,
# no pg_*/information_schema) before it reaches the database. Off by default;
# recommended for any deployment that accepts queries from untrusted callers.
# [security]
# sql_gate = "on"

# Optional IP firewall: allow/deny lists (CIDRs or bare IPs) gating every route by
# resolved client IP. A deny match is rejected with 403; if allow_ips is non-empty
# only those addresses are admitted (default-deny). Both empty disables it.
# [security]
# allow_ips = ["10.0.0.0/8", "192.168.0.0/16"]
# deny_ips  = ["203.0.113.7"]

# Optional XSRF/CSRF protection (double-submit cookie): when "on", state-changing
# requests (POST/PUT/PATCH/DELETE) must echo the XSRF-TOKEN cookie in an
# X-XSRF-TOKEN header. Defense in depth for browser deployments that authenticate
# with cookies or HTTP Basic. Off by default.
# [security]
# xsrf = "on"

# Optional proactive cost ceiling (PostgreSQL only): EXPLAIN each query first and
# reject it with 400 if the planner's estimated cost or rows exceed the bound,
# before any execution. 0 disables. Pick max_estimated_cost in planner cost units
# (the numbers EXPLAIN prints) from representative queries.
# [limits]
# max_estimated_cost = 1000000
# max_estimated_rows = 500000
