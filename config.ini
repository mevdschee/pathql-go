# Minimal pathql-server configuration (the simple, no-RLS setup): every query
# runs on one shared connection. This is the development / single-tenant
# on-ramp. The README documents every option and the hardened "login_role" mode
# (a database role per user, with row-level security on current_user).

driver = "postgres"
dsn    = "host=localhost port=5432 dbname=pathql sslmode=disable"
listen = ":8000"

# Authentication is optional in this mode. Omit [auth] to run open (the server
# logs a warning at startup), or require an API key / Basic password:
# [auth]
# methods = ["apikey", "basic"]
