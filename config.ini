driver  = "postgres"
dsn     = "host=localhost port=5432 user=pathql_app password=${PATHQL_DB_PASSWORD} dbname=pathql sslmode=disable"
listen  = ":8000"
verbose = false

[database]
max_open_conns = 50
max_idle_conns = 10
conn_max_lifetime_ms = 300000
conn_max_idle_time_ms = 60000
# Hard ceiling on simultaneous DB connections across all per-role pools
# (login_role mode), enforced by a shared semaphore. Config only. Default 200.
max_total_backends = 200

[security]
auth_table_prefix = "pathql_auth_"
session_variable  = "app.user"
read_only         = true
# Reject queries that contain more than one statement. Keep this on.
block_multiple_statements = true
# The app_user identity allowed to read GET /metrics; that principal can do
# nothing else. Empty disables the metrics endpoint (fail closed). Default "metrics".
metrics_user = "metrics"
# Database hardening self-check at startup: "off", "warn" (log findings), or
# "enforce" (refuse to start on a critical finding: superuser or write access).
startup_checks = "warn"
# Identity model for RLS: "session_guc" (default) binds app.user via set_config
# and policies read current_setting; "login_role" connects as the caller's own
# database role and policies read current_user (unforgeable). See [roles] below.
identity_kind = "session_guc"
# The app_user identity allowed on the /admin/* routes; that principal may only
# use admin routes. Empty disables them (fail closed). Default "" (off).
admin_user = ""
# CIDRs whose RemoteAddr is trusted to set X-Forwarded-For / X-Real-IP.
# trusted_proxies = ["10.0.0.0/8", "192.168.0.0/16"]

# [roles] is only used when security.identity_kind = "login_role". The server
# connects as each caller's own database role (trust/peer auth on an isolated
# channel) and emits role-sync DDL for a cron job to apply; it never holds
# CREATEROLE. See ROLE_MANAGEMENT_PLAN.md and examples/login-role/.
# [roles]
# base_dsn        = "host=localhost port=5432 dbname=pathql sslmode=disable"  # no user=
# baseline_role   = "pathql_auth"     # role for auth lookups and catalog reads
# prefix          = "pathql_r_"       # managed role name = prefix + user id
# reader_role     = "pathql_readers"  # group role granting read access
# warm_pool_limit = 64                # config-only LRU cap on warm pools

[auth]
# Enabled methods: any subset of "apikey", "basic", "jwt".
# jwt is NOT enabled by default; to enable it add "jwt" here and configure the
# jwt_* keys below.
methods        = ["apikey", "basic"]
api_key_header = "X-API-Key"
# JWT (only used when "jwt" is in methods):
#   jwt_algorithms must be non-empty, e.g. ["RS256"] or ["HS256"].
#   HS256 requires jwt_hs256_secret; RS256/ES256/etc require jwt_jwks_url.
# jwt_algorithms   = ["RS256"]
# jwt_jwks_url     = "https://issuer.example/.well-known/jwks.json"
# jwt_issuer       = "https://issuer.example/"
# jwt_audience     = "pathql"
# jwt_user_claim   = "sub"
# jwt_hs256_secret = "${JWT_HS256_SECRET}"
# require_user_row = false

[limits]
max_query_ms   = 5000
max_body_bytes = 1048576
# Cap the encoded JSON response; an oversized result is rejected with 413. 0 = unlimited.
max_response_bytes = 10485760
max_concurrent_per_user = 10
max_concurrent_global   = 200
max_requests_per_min_ip = 120
# Lock out a credential (API-key prefix / Basic user / IP) after this many auth
# failures per minute, returning 429. 0 disables.
max_auth_failures_per_min = 60
# Transaction-local work_mem in kB for each query (bounds a single sort/hash).
# 0 leaves the PostgreSQL default.
work_mem_kb = 0

[timeouts]
read_ms  = 10000
write_ms = 30000
idle_ms  = 60000

[cache]
# Abuse-protection counters and JWKS cache. Only "embedded" is supported.
backend   = "embedded"
memory_mb = 64
auth_ttl  = "30s"
jwks_ttl  = "1h"

[tls]
# Disabled by default. When enabled, cert_file and key_file are required.
enabled       = false
# cert_file     = "/etc/pathql/tls.crt"
# key_file      = "/etc/pathql/tls.key"
hsts          = true
# Optional plain-HTTP listener that 301-redirects to https.
# redirect_http = ":8080"

[cors]
# Explicit allowed origins (exact match). Never combined with credentials as "*".
allowed_origins = []
